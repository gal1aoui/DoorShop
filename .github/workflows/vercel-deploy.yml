name: CI + Vercel Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format

      - name: Lint
        run: npm run lint

  build_deploy:
    name: Build and Deploy (main)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate CI variables
        run: |
          set -euo pipefail
          REQUIRED_VARS=(
            VERCEL_TOKEN
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            NEXT_PUBLIC_SUPABASE_ANON_KEY
          )

          for VAR_NAME in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR_NAME:-}" ]; then
              echo "::error::Missing required GitHub secret/variable: ${VAR_NAME}"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Resolve Vercel project name
        id: resolve_project
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_PROJECT_NAME:-}" ]; then
            PROJECT_NAME="${VERCEL_PROJECT_NAME}"
          else
            REPO_NAME="${GITHUB_REPOSITORY##*/}"
            PROJECT_NAME="$(echo "${REPO_NAME}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g; s/---+/-/g; s/^-+//; s/-+$//')"
            PROJECT_NAME="${PROJECT_NAME:0:100}"
          fi

          if [ -z "${PROJECT_NAME}" ]; then
            echo "::error::Unable to resolve a valid Vercel project name."
            exit 1
          fi

          echo "project_name=${PROJECT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Using Vercel project: ${PROJECT_NAME}"

      - name: Create .env.local from GitHub Variables
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
          EOF

      - name: Link Vercel project
        run: |
          npx vercel@latest link --yes --token "${VERCEL_TOKEN}" \
            --project "${{ steps.resolve_project.outputs.project_name }}"

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: |
          npx vercel@latest deploy --prod --yes --token "${VERCEL_TOKEN}" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            --env NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
